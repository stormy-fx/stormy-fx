<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">STORMY FX — Infinite Motion</title><desc id="desc">Dark cinematic banner with crimson gradients, animated infinity lines, and technical frame details.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050609"/><stop offset=".52" stop-color="#140912"/><stop offset="1" stop-color="#08090D"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#ff315b" stop-opacity=".28"/><stop offset="1" stop-color="#ff315b" stop-opacity="0"/></radialGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".24" stop-color="#ff5368"/><stop offset=".55" stop-color="#7b1837"/><stop offset=".78" stop-color="#ff9aaa"/><stop offset="1" stop-color="#581126"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
 <filter id="glowline" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="390" rx="28" fill="url(#bg)"/>
<ellipse cx="600" cy="160" rx="390" ry="210" fill="url(#glow)" filter="url(#blur)"/>
<g fill="none" stroke="#6d273a" stroke-opacity=".3">
 <path d="M0 70H1200M0 320H1200M80 0V390M1120 0V390"/>
 <path d="M0 105H1200M0 285H1200" stroke-dasharray="2 12"/>
</g>
<g fill="none" stroke="url(#metal)" stroke-width="5" stroke-linecap="round" filter="url(#glowline)">
 <path d="M410 160 C410 92 500 82 570 155 C630 220 690 260 750 215 C820 162 780 91 720 106 C660 120 620 210 550 242 C480 274 410 226 410 160Z" opacity=".92">
  <animate attributeName="stroke-dasharray" values="20 16;80 24;20 16" dur="8s" repeatCount="indefinite"/>
  <animate attributeName="stroke-dashoffset" values="0;-220;0" dur="10s" repeatCount="indefinite"/>
 </path>
 <path d="M790 160 C790 92 700 82 630 155 C570 220 510 260 450 215 C380 162 420 91 480 106 C540 120 580 210 650 242 C720 274 790 226 790 160Z" opacity=".45">
  <animate attributeName="stroke-dashoffset" values="0;240;0" dur="9s" repeatCount="indefinite"/>
 </path>
</g>
<g fill="#ff8b9d"><circle cx="310" cy="160" r="3"/><circle cx="890" cy="160" r="3"/><circle cx="600" cy="64" r="2"/></g>
<g fill="#a9a2ac" font-family="monospace" font-size="12" letter-spacing="3"><text x="58" y="48">STORMY / FX</text><text x="1140" y="48" text-anchor="end">CREATIVE SYSTEMS · 001</text><text x="58" y="350">MOTION / DEPTH / PRECISION</text><text x="1140" y="350" text-anchor="end">INFINITE EVOLUTION</text></g>
<path d="M30 78V30H78M1122 30H1170V78M30 312V360H78M1122 360H1170V312" fill="none" stroke="#ff5368" stroke-opacity=".8" stroke-width="2"/>
<text x="600" y="300" fill="#f6f1f4" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="46" letter-spacing="5" text-anchor="middle">STORMY FX</text>
<text x="600" y="326" fill="#ff7187" font-family="monospace" font-size="12" letter-spacing="4" text-anchor="middle">ENGINEERING THE INFINITE</text>
</svg>